services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paiecam
      POSTGRES_PASSWORD: paiecam_dev
      POSTGRES_DB: paiecam
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paiecam"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
