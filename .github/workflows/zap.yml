name: Scan ZAP (préproduction)

# Désactivé tant qu'aucune préproduction n'existe : lancement manuel uniquement, jamais sur la
# production (le scan « baseline » est passif mais parcourt le site). Cible : URL de préproduction
# avec des données fictives.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "URL de préproduction (https://…)"
        required: true

permissions:
  contents: read
  issues: write # le rapport peut ouvrir un ticket

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuser une cible non HTTPS ou de production
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            https://*preprod*|https://*staging*) ;;
            *) echo "cible refusée : préproduction HTTPS uniquement" >&2; exit 1 ;;
          esac
      # v0.15.0, épinglé par empreinte de commit
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ inputs.target }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          fail_action: true
