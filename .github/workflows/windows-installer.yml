name: Installateur Windows

# Construit PaieCam-Setup-<version>.exe sur Windows, puis l'installe réellement sur le runner :
# services démarrés, application qui répond, première sauvegarde, désinstallation sans perte.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Composants embarqués : versions et empreintes épinglées (téléchargement refusé sinon).
  NODE_VERSION: "22.23.4"
  NODE_SHA256: "cbc74b5e0982c9dbb41525fd8fb5dcd32fbee237863f7829072f4639a1ce5f20"
  # Vérifier à chaque version qu'aucune 16.x plus récente n'est sortie (correctifs de sécurité).
  PG_VERSION: "16.14-1"
  # Relevée au premier téléchargement (10/11/2026, TLS vers get.enterprisedb.com) : EDB ne publie
  # pas d'empreinte ; elle garantit que le fichier ne change plus, pas son contenu d'origine.
  PG_SHA256: "98af1417ba6a8dc30543e560e5407833a3b9e7cc7ed20e73b2006f3aa2f04663"
  WINSW_VERSION: "v2.12.0"
  WINSW_SHA256: "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da"

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # node_modules à plat (sans liens symboliques) : l'application autonome de Next.js se copie
      # alors fichier par fichier, sans paquet perdu en route (ex. @swc/helpers).
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Application web (Next.js autonome, adresse locale)
        shell: bash
        run: APP_URL=http://127.0.0.1:3000 sh scripts/build-web.sh

      - name: Assemblage
        run: |
          $d = "dist\paiecam"
          node scripts/windows/bundle.mjs "$d\outils"
          if ($LASTEXITCODE) { throw "regroupement" }
          # Liens symboliques de pnpm remplacés par les fichiers réels (installateur autonome).
          node scripts/windows/copy-tree.mjs apps\web\.next\standalone "$d\web"
          if ($LASTEXITCODE) { throw "copie de l'application" }
          node scripts/windows/copy-tree.mjs apps\web\.next\static "$d\web\apps\web\.next\static"
          if ($LASTEXITCODE) { throw "copie des fichiers statiques" }
          # Module natif Argon2 (outil d'administration : réinitialisation des mots de passe).
          New-Item -ItemType Directory -Force "$d\outils\node_modules\@node-rs" | Out-Null
          foreach ($pkg in "@node-rs/argon2", "@node-rs/argon2-win32-x64-msvc") {
            $dir = node -e "const p=require('path');console.log(p.dirname(require.resolve('$pkg/package.json',{paths:['apps/web']})))"
            if ($LASTEXITCODE -or -not $dir) { throw "paquet $pkg introuvable" }
            node scripts/windows/copy-tree.mjs $dir "$d\outils\node_modules\$($pkg -replace '/', '\')"
            if ($LASTEXITCODE) { throw "copie de $pkg" }
          }
          Copy-Item -Recurse windows\scripts "$d\scripts"
          New-Item -ItemType Directory -Force "$d\services" | Out-Null
          Copy-Item windows\services\*.xml "$d\services\"

      - name: Composants externes (vérifiés par empreinte)
        run: |
          $d = "dist\paiecam"
          function Get-Verified($url, $file, $sha) {
            Invoke-WebRequest -UseBasicParsing $url -OutFile $file
            $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            if ($got -ne $sha) { throw "Empreinte inattendue pour $url : $got (attendu : $sha)" }
          }
          Get-Verified "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" node.zip $env:NODE_SHA256
          Expand-Archive node.zip -DestinationPath node-tmp
          Move-Item "node-tmp\node-v$env:NODE_VERSION-win-x64" "$d\node"
          Get-Verified "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-windows-x64-binaries.zip" pg.zip $env:PG_SHA256
          Expand-Archive pg.zip -DestinationPath pg-tmp
          # Seuls le serveur et ses outils : ni pgAdmin, ni StackBuilder, ni documentation.
          New-Item -ItemType Directory -Force "$d\pgsql" | Out-Null
          foreach ($p in "bin", "lib", "share") { Copy-Item -Recurse "pg-tmp\pgsql\$p" "$d\pgsql\$p" }
          Get-Verified "https://github.com/winsw/winsw/releases/download/$env:WINSW_VERSION/WinSW-x64.exe" winsw.exe $env:WINSW_SHA256
          foreach ($s in "PaieCam-Web", "PaieCam-Worker") { Copy-Item winsw.exe "$d\services\$s.exe" }

      - name: Installateur (Inno Setup)
        run: |
          $version = (Get-Content apps\web\package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DSource=$PWD\dist\paiecam" windows\paiecam.iss
          if ($LASTEXITCODE) { throw "ISCC" }

      - name: Essai réel sur Windows
        timeout-minutes: 15
        run: |
          $setup = Get-ChildItem windows\Output\PaieCam-Setup-*.exe | Select-Object -First 1
          $data = "$env:ProgramData\PaieCam"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install.log" -PassThru
          if (-not $p.WaitForExit(600000)) {
            # Le script de préparation (PowerShell) tourne encore : on l'arrête pour lire ses journaux.
            Get-Process powershell -ErrorAction SilentlyContinue | Stop-Process -Force
            $p.Kill()
            throw "installateur bloqué plus de 10 minutes"
          }
          if ($p.ExitCode -ne 0) { throw "installateur : code $($p.ExitCode)" }
          foreach ($s in "PaieCam-Base", "PaieCam-Web", "PaieCam-Worker") {
            if ((Get-Service $s).Status -ne "Running") { throw "service $s arrêté" }
          }
          $r = Invoke-WebRequest -UseBasicParsing -NoProxy http://127.0.0.1:3000/api/health
          if ($r.StatusCode -ne 200) { throw "application injoignable" }
          # Le worker sauvegarde au premier démarrage.
          for ($i = 0; $i -lt 60 -and -not (Get-ChildItem "$data\sauvegardes\*.sauvegarde" -ErrorAction SilentlyContinue); $i++) { Start-Sleep 2 }
          if (-not (Get-ChildItem "$data\sauvegardes\*.sauvegarde")) { throw "aucune sauvegarde" }
          # Réservé aux administrateurs : le groupe Utilisateurs n'a aucun droit sur les données.
          if ((icacls "$data\config\paiecam.env") -match "BUILTIN\\Users|BUILTIN\\Utilisateurs") { throw "configuration lisible par tous" }
          # L'application n'écoute que sur ce PC.
          $listen = Get-NetTCPConnection -State Listen -LocalPort 3000, 5433
          if ($listen | Where-Object { $_.LocalAddress -notin "127.0.0.1" }) { throw "écoute hors de 127.0.0.1" }
          $uninstall = Get-ChildItem "$env:ProgramFiles\PaieCam\unins*.exe" | Select-Object -First 1
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          if (Get-Service PaieCam-Web -ErrorAction SilentlyContinue) { throw "service non retiré" }
          if (-not (Test-Path "$data\config\paiecam.env")) { throw "données supprimées à la désinstallation" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Publié même si l'essai échoue : il reste possible de l'essayer à la main.
        if: always()
        with:
          name: PaieCam-Setup
          path: windows/Output/PaieCam-Setup-*.exe
          if-no-files-found: ignore
          retention-days: 30
      # Journaux affichés et copiés dans l'espace de travail (l'envoi refuse les autres dossiers).
      - name: Journaux de l'installation
        if: always()
        run: |
          New-Item -ItemType Directory -Force journaux | Out-Null
          Copy-Item install.log journaux\ -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\PaieCam\journaux\*" journaux\ -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\PaieCam\donnees\base\demarrage.log" journaux\ -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\PaieCam\donnees\base\log\*" journaux\ -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramFiles\PaieCam\services\*.log" journaux\ -ErrorAction SilentlyContinue
          foreach ($f in Get-ChildItem journaux -File) { Write-Host "===== $($f.Name)"; Get-Content $f.FullName -Tail 80 }
          Write-Host "===== services"
          Get-Service PaieCam-* -ErrorAction SilentlyContinue | Format-Table -AutoSize Name, Status, StartType | Out-String | Write-Host
          Write-Host "===== gestionnaire de services (erreurs récentes)"
          Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; Level = 1, 2, 3 } -MaxEvents 15 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message | Out-String | Write-Host
          Write-Host "===== application (erreurs récentes)"
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; Level = 1, 2 } -MaxEvents 10 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-String | Write-Host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journaux-installation
          path: journaux
          if-no-files-found: ignore
