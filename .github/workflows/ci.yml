name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://paiecam_app:app_dev@localhost:5432/paiecam_test
      TEST_MIGRATION_DATABASE_URL: postgres://paiecam_owner:owner_dev@localhost:5432/paiecam_test
      TEST_OPS_DATABASE_URL: postgres://paiecam_ops:ops_dev@localhost:5432/paiecam_test
      TEST_BACKUP_DATABASE_URL: postgres://paiecam_backup:backup_dev@localhost:5432/paiecam_test
      TEST_ROTATION_DATABASE_URL: postgres://paiecam_rotation:rotation_dev@localhost:5432/paiecam_test
      PG_BIN: /usr/lib/postgresql/16/bin
      TEST_RESTORE_ADMIN_DATABASE_URL: postgres://postgres:postgres_ci@localhost:5432/paiecam_restore_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Créer les rôles et bases de test
        run: psql -h localhost -U postgres -f docker/postgres/init.sql
        env:
          PGPASSWORD: postgres_ci
      - name: Outils des tests de sauvegarde et d'installation locale (age, PostgreSQL 16)
        run: sudo apt-get update -q && sudo apt-get install -yq age postgresql-16
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:golden
      - run: pnpm audit --prod --audit-level high
      - name: Build de production (sans secret)
        run: APP_URL=https://app.exemple.test sh scripts/build-web.sh

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://paiecam_app:app_dev@localhost:5432/paiecam_test
      TEST_MIGRATION_DATABASE_URL: postgres://paiecam_owner:owner_dev@localhost:5432/paiecam_test
      TEST_OPS_DATABASE_URL: postgres://paiecam_ops:ops_dev@localhost:5432/paiecam_test
      TEST_BACKUP_DATABASE_URL: postgres://paiecam_backup:backup_dev@localhost:5432/paiecam_test
      TEST_ROTATION_DATABASE_URL: postgres://paiecam_rotation:rotation_dev@localhost:5432/paiecam_test
      TEST_RESTORE_ADMIN_DATABASE_URL: postgres://postgres:postgres_ci@localhost:5432/paiecam_restore_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Créer les rôles et bases de test
        run: psql -h localhost -U postgres -f docker/postgres/init.sql
        env:
          PGPASSWORD: postgres_ci
      - run: pnpm --filter @paiecam/web exec playwright install --with-deps chromium
      - run: pnpm --filter @paiecam/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/typescript --config p/owasp-top-ten --config p/secrets --config .semgrep.yml --error
