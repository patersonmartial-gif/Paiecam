# Exemple de déploiement (non testé ici : Docker indisponible dans l'environnement de développement).
# Les secrets viennent d'un fichier .env.production hors dépôt (voir .env.example).
services:
  web:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: web
      args: { APP_URL: "${APP_URL}" }
    env_file: ../.env.production
    ports: ["127.0.0.1:3000:3000"] # derrière le reverse proxy TLS (TRUSTED_PROXY_HEADER)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
  worker:
    build: { context: .., dockerfile: docker/app/Dockerfile, target: worker }
    env_file: ../.env.production
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
